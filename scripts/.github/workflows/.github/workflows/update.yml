name: Atualizar pontuações

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 04:00 em Brasília
  workflow_dispatch:       # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_espn.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
      - name: Salvar dados
        run: |
          git config user.name "fantasy-bot"
          git config user.email "fantasy-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "Sem mudanças" || (git commit -m "Atualiza pontuações" && git push)
